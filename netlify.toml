[build]
  command = "bash build.sh"
  publish = "dist"

[[redirects]]
  from = "/pflege"
  to = "/pflege.html"
  status = 200

[[redirects]]
  from = "/handwerk"
  to = "/handwerk.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
