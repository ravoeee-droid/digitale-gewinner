[build]
  command = "bash build.sh"
  publish = "dist"

[[redirects]]
  from = "/pflege"
  to = "/pflege.html"
  status = 200

[[redirects]]
  from = "/handwerk"
  to = "/handwerk.html"
  status = 200

[[redirects]]
  from = "/ki-websites"
  to = "/ki-websites.html"
  status = 200

[[redirects]]
  from = "/pv-trust"
  to = "/pv-trust.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"


[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
